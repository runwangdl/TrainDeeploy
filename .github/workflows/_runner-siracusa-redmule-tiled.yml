---
name: _runner-siracusa-redmule-tiled-sequential

"on":
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      docker-image:
        required: true
        type: string
      pytest-marker:
        required: true
        type: string
      # Extra flags injected into the pytest command, between -v and the -m
      # marker filter.  Default keeps the original 4-worker xdist behavior;
      # callers that want simulator stdout (e.g. GVSoC cycle counts) in the
      # CI log can override with "-s -p no:xdist" to disable capture and
      # the parallel worker plugin (xdist eats per-test stdout).
      pytest-flags:
        required: false
        type: string
        default: "-n 4"

jobs:
  test-runner-siracusa-redmule-tiled:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.docker-image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark workspace as safe
        run: git config --global --add safe.directory '*'
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Deeploy
        shell: bash
        run: pip install -e .
      - name: Run Test
        run: |
          cd DeeployTest
          mkdir -p /app/.ccache
          export CCACHE_DIR=/app/.ccache
          pytest test_platforms.py -v ${{ inputs.pytest-flags }} -m "siracusa_redmule_tiled and ${{ inputs.pytest-marker }}"
        shell: bash
