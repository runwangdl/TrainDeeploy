---
name: Docker • Build TrainDeeploy Container

"on":
  workflow_dispatch:
    inputs:
      base_image:
        description: "GAP9 base image to layer on"
        required: false
        default: "ghcr.io/runwangdl/deeploy:gap9"
      onnx4deeploy_ref:
        description: "Onnx4Deeploy branch/tag to install"
        required: false
        default: "devel"
  push:
    branches: [devel]
    paths:
      - "Container/Dockerfile.traindeeploy"
      - "Container/traindeeploy-bake-env.sh"
      - "Container/dp"
      - ".github/workflows/docker-build-traindeeploy.yml"
  # Same-repo PRs get the secrets, so the image can be built and smoke-tested on
  # the branch instead of merging blind. PR builds tag by branch and never move
  # :latest -- see the metadata step.
  # (Paths repeated rather than shared via a YAML anchor: Actions does not
  # support anchors/aliases in workflow files.)
  pull_request:
    branches: [devel]
    paths:
      - "Container/Dockerfile.traindeeploy"
      - "Container/traindeeploy-bake-env.sh"
      - "Container/dp"
      - ".github/workflows/docker-build-traindeeploy.yml"

jobs:
  build:
    name: Build and push TrainDeeploy image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The GAP9 base is ~5 GB compressed and unpacks to far more; the default
      # runner image does not leave enough room for it plus our layers.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN cannot read ghcr.io/runwangdl/deeploy:gap9 -- that package is
      # private and owned by the user, not by this repo. Only one docker login per
      # registry sticks, and the same credential has to both pull the base and
      # push the result, hence a PAT with read:packages + write:packages.
      - name: GHCR Log-in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Lower Case Repository Name
        run: echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      # metadata-action resolves the branch name correctly for PRs too, where
      # GITHUB_REF is refs/pull/N/merge and naive ${GITHUB_REF##*/} yields "merge".
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/traindeeploy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/devel' }}

      # amd64 only, deliberately: the base image is amd64, and every consumer is
      # an x86_64 IIS machine.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: Container/Dockerfile.traindeeploy
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || 'ghcr.io/runwangdl/deeploy:gap9' }}
            ONNX4DEEPLOY_REF=${{ github.event.inputs.onnx4deeploy_ref || 'devel' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report pushed tags
        run: echo "${{ steps.meta.outputs.tags }}"
