---
name: Docker • Build TrainDeeploy Container

"on":
  workflow_dispatch:
    inputs:
      base_image:
        description: "GAP9 base image to layer on"
        required: false
        default: "ghcr.io/runwangdl/deeploy:gap9"
      onnx4deeploy_ref:
        description: "Onnx4Deeploy branch/tag to install"
        required: false
        default: "devel"
  push:
    branches: [devel]
    paths:
      - "Container/Dockerfile.traindeeploy"
      - "Container/traindeeploy-bake-env.sh"
      - "Container/dp"
      - ".github/workflows/docker-build-traindeeploy.yml"

jobs:
  build:
    name: Build and push TrainDeeploy image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The GAP9 base carries a full RISC-V toolchain and SDK; the default
      # runner image does not leave enough room to unpack it plus our layers.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN cannot read ghcr.io/runwangdl/deeploy:gap9 -- that package is
      # private and owned by the user, not by this repo. One docker login per
      # registry is all that sticks, and the same credential has to both pull the
      # base and push the result, so this PAT needs read:packages + write:packages.
      - name: GHCR Log-in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Lower Case Repository Name
        run: echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Set image tag
        id: tag
        run: echo "docker_tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      # amd64 only, deliberately: every consumer is an x86_64 IIS machine, and a
      # second arch would roughly double build time for nothing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: Container/Dockerfile.traindeeploy
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || 'ghcr.io/runwangdl/deeploy:gap9' }}
            ONNX4DEEPLOY_REF=${{ github.event.inputs.onnx4deeploy_ref || 'devel' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/traindeeploy:${{ steps.tag.outputs.docker_tag }}
            ghcr.io/${{ env.OWNER_LC }}/traindeeploy:latest
