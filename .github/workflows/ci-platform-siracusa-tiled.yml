---
name: CI • Siracusa (Tiled)

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      docker_image_deeploy:
        description: "Deeploy Image to use"
        required: false
        default: "ghcr.io/pulp-platform/deeploy:devel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-env:
    uses: ./.github/workflows/_select-env.yml
    with:
      docker_image_deeploy: ${{ inputs.docker_image_deeploy }}

  # Training tests - L2 singlebuffer
  siracusa-training-tiled-l2-singlebuffer:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and l2 and singlebuffer"

  # Training tests - L3 singlebuffer (models that spill weights/activations to L3)
  siracusa-training-tiled-l3-singlebuffer:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and l3 and singlebuffer"

  # Inference tests - L3 singlebuffer with PromoteTensorsToL2 enabled.
  # Exercises the L2-promoted DMA byte-offset codegen across strategies.
  siracusa-tiled-l3-singlebuffer-promote:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "models and promote and l3 and singlebuffer"

  # Training tests - L3 singlebuffer with PromoteTensorsToL2 enabled.
  # Verifies the promotion pass works on training graphs (forward +
  # backward + optimizer) and emits a "Tiled L3 training + promote
  # cycle reference" Markdown table to the run summary so reviewers
  # can compare against the no-promote training baseline.
  siracusa-training-tiled-l3-singlebuffer-promote:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and promote and l3 and singlebuffer"
