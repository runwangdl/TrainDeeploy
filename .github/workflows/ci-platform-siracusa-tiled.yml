---
name: CI • Siracusa (Tiled)

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      docker_image_deeploy:
        description: "Deeploy Image to use"
        required: false
        default: "ghcr.io/pulp-platform/deeploy:devel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-env:
    uses: ./.github/workflows/_select-env.yml
    with:
      docker_image_deeploy: ${{ inputs.docker_image_deeploy }}

  # Training tests - L2 (SB + DB combined so the runner emits a single
  # SB-vs-DB cycle comparison table to $GITHUB_STEP_SUMMARY).
  siracusa-training-tiled-l2:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and l2"

  # Training tests - L3 (SB + DB combined; DB uses TrainingDBOnlyL3Tiler so
  # the L2 staging budget doesn't double).
  siracusa-training-tiled-l3:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and l2 and doublebuffer"

  # Training tests - L3 singlebuffer (models that spill weights/activations to L3)
  siracusa-training-tiled-l3-singlebuffer:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and l3 and singlebuffer and not promote"

  # Training tests - L3 doublebuffer
  siracusa-training-tiled-l3-doublebuffer:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and l3 and doublebuffer"

  # Inference L3 + PromoteTensorsToL2 regression
  siracusa-inference-tiled-promote:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "promote and not training"

  # Training L3 + PromoteTensorsToL2 regression (MobileNetV1 + CCT)
  siracusa-training-tiled-promote:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "promote and training"
