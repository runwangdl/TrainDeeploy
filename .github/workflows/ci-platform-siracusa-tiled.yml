---
name: CI • Siracusa (Tiled)

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  # pull_request: temporarily disabled so this workflow doesn't run twice
  # per push (once for the push event, once for the PR sync event).
  workflow_dispatch:
    inputs:
      docker_image_deeploy:
        description: "Deeploy Image to use"
        required: false
        default: "ghcr.io/pulp-platform/deeploy:devel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-env:
    uses: ./.github/workflows/_select-env.yml
    with:
      docker_image_deeploy: ${{ inputs.docker_image_deeploy }}

  # DIAGNOSTIC MODE: only the two tensor-promotion jobs are active so
  # iteration on the L3-promote failure isn't blocked by ~30 min of
  # unrelated tests per push. Restore the other jobs once promote is
  # stable on the training graphs.
  #
  # siracusa-training-tiled-l2-singlebuffer:
  #   needs: select-env
  #   uses: ./.github/workflows/_runner-siracusa-tiled.yml
  #   with:
  #     runner: ${{ needs.select-env.outputs.runner }}
  #     docker-image: ${{ needs.select-env.outputs.image }}
  #     pytest-marker: "training and l2 and singlebuffer"
  #
  # siracusa-training-tiled-l3-singlebuffer:
  #   needs: select-env
  #   uses: ./.github/workflows/_runner-siracusa-tiled.yml
  #   with:
  #     runner: ${{ needs.select-env.outputs.runner }}
  #     docker-image: ${{ needs.select-env.outputs.image }}
  #     pytest-marker: "training and l3 and singlebuffer"

  # Inference promote (tensor-promotion regression check, passes today
  # and runs in ~5 min — kept on so we notice if promote changes break
  # the inference path).
  siracusa-tiled-l3-singlebuffer-promote:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "models and promote and l3 and singlebuffer"

  # Training promote (the one currently failing on ResNet8 / MobileNetV1).
  siracusa-training-tiled-l3-singlebuffer-promote:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa-tiled.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "training and promote and l3 and singlebuffer"
