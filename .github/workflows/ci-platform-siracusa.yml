---
name: CI • Siracusa

# NOTE: Push / pull_request triggers temporarily disabled on this branch
# so only the L3-untiled job runs while we collect cycle-count data.
# Restore the push: / pull_request: blocks before merging.
"on":
  workflow_dispatch:
    inputs:
      docker_image_deeploy:
        description: "Deeploy Image to use"
        required: false
        default: "ghcr.io/pulp-platform/deeploy:devel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-env:
    uses: ./.github/workflows/_select-env.yml
    with:
      docker_image_deeploy: ${{ inputs.docker_image_deeploy }}

  siracusa-training:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: training

  siracusa-train-kernel:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: train_kernel
