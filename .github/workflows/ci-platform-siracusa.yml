---
name: CI • Siracusa

"on":
  # DIAGNOSTIC: skip siracusa-train-kernel / siracusa-training on feature
  # branches so iteration on the L3-promote training failure isn't blocked
  # by ~30 min of unrelated runs. Restore `branches: "**"` once promote is
  # stable.
  push:
    branches:
      - main
      - devel
    tags:
      - "v*.*.*"
  # pull_request: temporarily disabled so feature-branch PRs don't
  # re-fire siracusa-train-kernel / siracusa-training on every commit.
  workflow_dispatch:
    inputs:
      docker_image_deeploy:
        description: "Deeploy Image to use"
        required: false
        default: "ghcr.io/pulp-platform/deeploy:devel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-env:
    uses: ./.github/workflows/_select-env.yml
    with:
      docker_image_deeploy: ${{ inputs.docker_image_deeploy }}

  siracusa-training:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: training

  siracusa-train-kernel:
    needs: select-env
    uses: ./.github/workflows/_runner-siracusa.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: train_kernel
